name: Build PSP Game

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container: 
      image: pspdev/pspdev:latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build project
      run: |
        make

    - name: Upload EBOOT.PBP artifact
      uses: actions/upload-artifact@v4
      with:
        name: PSP-Game-EBOOT
        path: EBOOT.PBP
        
